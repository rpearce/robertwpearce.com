<!DOCTYPE html>
<html lang="en">
  <head>
    $partial("templates/head.html")$
  </head>
  <body>
    <!--
      Banner photo with its credit. Every NZ banner is 1600x500. The inline
      style is the one exception to these pages being unstyled: it keeps the
      banner inside narrow screens instead of forcing sideways scrolling.
      imageAlt is required whenever image is set, so the build fails
      without alt text.
    -->
    $if(image)$
    <figure>
      <img alt="$imageAlt$" height="500" src="$image$" style="height:auto;max-width:100%" width="1600">
      $if(photoCredit)$<figcaption>Photo: <a href="$photoWebsite$">$photoCredit$</a></figcaption>$endif$
    </figure>
    $endif$

    $body$
  </body>
</html>
