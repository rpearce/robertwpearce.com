<!DOCTYPE html>
<html lang="en">
  <head>
    $partial("templates/head.html")$

    <link rel="alternate" href="./atom.xml" title="$feedTitle$" type="application/atom+xml">
    <link rel="alternate" href="./rss.xml" title="$feedTitle$" type="application/rss+xml">

    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/tokens.css">
    <link rel="stylesheet" href="./css/site.css">

    <script>
      (() => {
        const root = document.documentElement;

        /* localStorage can throw (private windows, blocked storage). Treat
         * that as "nothing saved". */
        const storage = {
          get: (key) => { try { return localStorage.getItem(key); } catch { return null; } },
          set: (key, value) => { try { localStorage.setItem(key, value); } catch {} },
          remove: (key) => { try { localStorage.removeItem(key); } catch {} },
        };

        /*
         * Theme. "system" follows prefers-color-scheme through
         * `color-scheme: light dark` in tokens.css; "light" and "dark" pin
         * the scheme via data-theme on <html>.
         */
        const themes = ['system', 'light', 'dark'];

        const setTheme = (name) => {
          if (name === 'system' || !themes.includes(name)) {
            delete root.dataset.theme;
            storage.remove('prefTheme');
          } else {
            root.dataset.theme = name;
            storage.set('prefTheme', name);
          }
        };

        /*
         * Fonts. Files live at ./fonts/<FamilyWithoutSpaces>-<Face>.woff2 and
         * are only fetched once chosen. Anything not listed here means the
         * browser's own monospace, which needs nothing loaded.
         */
        const fonts = new Map([
          /* Ligatures off until https://github.com/googlefonts/spacemono/pull/2 is resolved */
          ['Liga Space Mono', { ligatures: false }],
          ['Victor Mono', {}],
          ['Fira Code', { italic: false }],
          ['JetBrains Mono', {}],
        ]);

        const loadFont = (family, { italic }) => {
          const base = './fonts/' + family.replaceAll(' ', '');
          const face = (name, descriptors) =>
            new FontFace(family, 'url("' + base + '-' + name + '.woff2") format("woff2")', { display: 'swap', ...descriptors });

          const faces = [face('Regular', { weight: 400 }), face('Bold', { weight: 700 })];

          if (italic !== false) {
            faces.push(face('Italic', { style: 'italic', weight: 400 }), face('BoldItalic', { style: 'italic', weight: 700 }));
          }

          for (const f of faces) {
            document.fonts.add(f);
          }

          return Promise.allSettled(faces.map((f) => f.load())).then((results) => {
            results.forEach((res, i) => {
              if (res.status === 'rejected') {
                console.error('site failed to load font: ' + faces[i].family);
              }
            });
          });
        };

        const setFont = (family) => {
          const font = fonts.get(family);

          if (!font) {
            root.style.removeProperty('--type-family-body');
            root.style.removeProperty('font-feature-settings');
            storage.remove('prefFont');
            return Promise.resolve();
          }

          root.style.setProperty('--type-family-body', family + ',monospace');

          if (font.ligatures === false) {
            root.style.setProperty('font-feature-settings', '"liga" 0');
          } else {
            root.style.removeProperty('font-feature-settings');
          }

          storage.set('prefFont', family);
          return loadFont(family, font);
        };

        const savedTheme = storage.get('prefTheme');
        /* Anything else counts as unset, including the old "clean-day" and
         * "clean-night": the previous script saved those on every visit, so
         * they can't be told apart from a reader's real choice. */
        const theme = themes.includes(savedTheme) ? savedTheme : 'system';
        const savedFont = storage.get('prefFont');
        const font = fonts.has(savedFont) ? savedFont : 'monospace';

        /* Apply before first paint */
        setTheme(theme);
        setFont(font);

        /* The selects live in the body, so wire them once it has parsed */
        document.addEventListener('DOMContentLoaded', () => {
          const wire = (el, value, set) => {
            el.value = value;
            el.addEventListener('change', (e) => set(e.target.value));
          };

          wire(document.querySelector('#select-theme'), theme, setTheme);
          wire(document.querySelector('#select-font'), font, setFont);
        });
      })();
    </script>
  </head>
  <body>
    <header>
      <nav>
        <div class="nav-skip">
          <a href="#content">Skip to content</a>
        </div>
        <a$if(isHome)$ aria-current="page"$endif$ aria-label="Home" class="nav-home" href="./">~</a>
        <span aria-hidden="true">/</span>
      </nav>

      <div class="header-extra">
        <a href="./atom.xml">RSS</a>
        <span aria-hidden="true">&compfn;</span>
        <noscript>(requires JS &rarr;)</noscript>
        <label class="sr-only" for="select-theme">Theme</label>
        <select id="select-theme">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
        <span aria-hidden="true">&compfn;</span>
        <label class="sr-only" for="select-font">Font</label>
        <select id="select-font">
          <option value="monospace">monospace</option>
          <option value="Liga Space Mono">Space Mono</option>
          <option value="Victor Mono">Victor Mono</option>
          <option value="Fira Code">Fira Code</option>
          <option value="JetBrains Mono">JetBrains Mono</option>
        </select>
      </div>
    </header>

    $body$

    <footer>
      <span aria-hidden="true" class="heart">♥</span>
      <span aria-hidden="true">&rarr;</span>
      <a href="https://github.com/sponsors/rpearce/">Sponsor my work</a>
      <span aria-hidden="true">&larr;</span>
      <span aria-hidden="true" class="heart">♥</span>
    </footer>
  </body>
</html>
